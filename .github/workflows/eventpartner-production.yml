name: Deploy eventpartner.ge production

on:
  push:
    branches: [eventpartner-preview-deploy]
    paths: [.github/workflows/eventpartner-production.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eventpartner-ge-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout the reviewed EventPartner release
        uses: actions/checkout@v4
        with:
          repository: antonvert/eventpartnerge
          ref: 009446b1075d17d74121990cf7b0bf085b88bc92
          path: site
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: site
        run: npm run build
      - name: Validate
        working-directory: site
        run: npm run check
      - name: Deploy production Worker through the existing account
        working-directory: site
        run: npx --yes wrangler@4 deploy --config wrangler.production.jsonc
      - name: Verify published language versions without sending enquiries
        run: |
          curl --fail --silent --show-error https://eventpartner.ge/ | grep -q 'G-K9YVTX0VDH'
          curl --fail --silent --show-error https://eventpartner.ge/ka/ | grep -q 'lang="ka"'
