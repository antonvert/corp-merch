name: Deploy eventpartner.ge preview

on:
  push:
    branches: [eventpartner-preview-deploy]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout eventpartner.ge
        uses: actions/checkout@v4
        with:
          repository: kirillgoncharik-commits/eventpartnerge
          ref: main
          path: site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        working-directory: site
        run: npm run build

      - name: Generate social preview
        working-directory: site
        run: |
          python -m pip install --quiet pillow
          python scripts/generate-social-preview.py

      - name: Validate
        working-directory: site
        run: npm run check

      - name: Make preview noindex
        working-directory: site
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > dist/_headers

      - name: Deploy to Cloudflare Workers preview
        working-directory: site
        run: npx --yes wrangler@4 deploy --config wrangler.preview.jsonc
